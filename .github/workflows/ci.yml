name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify package isolation
        run: |
          python -c "import sttensor; print('sttensor loaded successfully from', sttensor.__file__)"
          python -c "import sys; assert 'apps' not in sys.modules, 'apps must not be auto-imported'"

      - name: Run test suite with pytest
        run: |
          pytest -v
